services:
  postgres:
    image: postgres:16-alpine
    container_name: harry-physics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: harry_physics_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - harry_physics_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d harry_physics_app']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  harry_physics_postgres_data:
